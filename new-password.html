<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新パスワード入力画面</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/new-password.css">

</head>
<body>
  <div class="app-screen">
  <div class="signup-container">
    <div class="logo-area">
      <img src="image/ロゴ.png" alt="MoDex Logo" class="logo-image">
    </div>

    <h2 class="title">本人確認のための再認証</h2>

     <div class="description">
            <p>新しいパスワードを入力してください。</p>
      </div>

    <form id="password-form">

        <div class="form-group">
            <label>メールアドレス</label>
            <input type="email" id="account" readonly>
        </div>

        <div class="form-group">
            <label>パスワード</label>
            <input
                type="password"
                id="new-password"
                placeholder="新しいパスワード"
                required
             >
        </div>

        <div class="form-group">
            <label>パスワード再入力</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="もう一度入力してください"
                required
             >
        </div>

        <div class="submit-area">
          <button type="submit" class="btn btn-submit">次へ/確認</button>
        </div>

        <p id="error-message"></p>

    </form>
  </div>
</div>
  <script src="js/new-password.js"></script>
</body>
</html>
