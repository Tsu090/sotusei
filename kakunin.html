
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入力内容の確認 | MODEX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/kakunin2.css">
</head>
<body>
    <div class="app-screen">
    <main class="container">

        <div class="logo">
            <img src="image/ロゴ.png" alt="MODEX">
        </div>

        <h2>入力内容の確認</h2>

        <div class="description">
            <p>まだ手続きは完了していません。<br>
                内容をご確認の上、「この内容で確定する」を押してください。
            </p>
        </div>

        <!-- 入力内容確認エリア -->
        <section class="confirm-area">

            <div class="equal-line"></div>

             <div class="confirm-item">
                <p class="item-title">ニックネーム</p>
                <div class="item-content">
                    <span id="confirmName"></span>
                    <a href="new-login.html">[修正する]</a>
                </div>
            </div>

            <div class="dash-line"></div>

            <!-- メールアドレス -->
          <div class="confirm-item">
                <p class="item-title">メールアドレス</p>
                <div class="item-content">
                    <span id="confirmEmail"></span>
                    <a href="new-login.html">[修正する]</a>
                </div>
            </div>

            <div class="dash-line"></div>

            <!-- パスワード -->
           <div class="confirm-item">
                <p class="item-title">パスワード</p>
                <div class="item-content">
                    <span id="confirmPassword"></span>

                    <button type="button" id="togglePassword" class="eye-button">
                        👁
                    </button>

                    <a href="new-login.html">[修正する]</a>
                </div>
            </div>
            <div class="dash-line"></div>

            <!-- お問い合わせ内容 -->
            <div class="confirm-item">
                <p class="item-title">お問い合わせ内容</p>
                <div class="item-content">
                    <span>
                        パスワード再設定のメールが届きません。<br>
                        再送をお願いします。
                    </span>
                    <a href="passsetting.html">[再送する]</a>
                </div>
            </div>

            <div class="equal-line"></div>

        </section>

        <!-- 下部ボタン -->
        <div class="button-area">
            <a href="new-login.html" class="back-button">
                【◀戻って修正する】
            </a>

            <a href="#" class="confirm-button">
                【この内容で確定する▶】
            </a>
        </div>
        
    </main>
    </div>

    <script src="js/kakunin.js"></script>
</body>
</html>
