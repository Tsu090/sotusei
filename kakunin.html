
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入力内容の確認 | MODEX</title>
    <link rel="stylesheet" href="kakunin2.css">
</head>
<body>

    <main class="container">

        <div class="logo">
            <img src="image/ロゴ.png" alt="MODEX">
        </div>

        <h1>入力内容の確認</h1>

        <div class="description">
            <p>まだ手続きは完了していません。</p>
            <p>内容をご確認の上、「この内容で確定する」を押してください。</p>
        </div>

        <!-- 入力内容確認エリア -->
        <section class="confirm-area">

            <div class="equal-line"></div>

            <!-- メールアドレス -->
            <div class="confirm-item">
                <p class="item-title">メールアドレス</p>
                <div class="item-content">
                    <span>user@example.com</span>
                    <a href="#">[修正する]</a>
                </div>
            </div>

            <div class="dash-line"></div>

            <!-- パスワード -->
            <div class="confirm-item">
                <p class="item-title">パスワード</p>
                <p class="password">＊＊＊＊＊＊＊＊＊＊＊＊</p>
            </div>

            <div class="dash-line"></div>

            <!-- お名前 -->
            <div class="confirm-item">
                <p class="item-title">お名前</p>
                <div class="item-content">
                    <span>山田　太郎</span>
                    <a href="#">[修正する]</a>
                </div>
            </div>

            <div class="dash-line"></div>

            <!-- お問い合わせ内容 -->
            <div class="confirm-item">
                <p class="item-title">お問い合わせ内容</p>
                <div class="item-content">
                    <span>
                        パスワード再設定のメールが届きません。<br>
                        再送をお願いします。
                    </span>
                    <a href="#">[再送する]</a>
                </div>
            </div>

            <div class="equal-line"></div>

        </section>

        <!-- 下部ボタン -->
        <div class="button-area">
            <a href="#" class="back-button">
                【◀戻って修正する】
            </a>

            <a href="#" class="confirm-button">
                【この内容で確定する▶】
            </a>
        </div>

    </main>

</body>
</html>
