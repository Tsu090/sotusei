<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - MDex</title>
    <!-- 外部CSSファイルの読み込み -->
    <link rel="stylesheet" href="saisextutei .css">
</head>
<body>

<div class="container">
    <!-- ロゴ部分 -->
    <div class="logo-area">
        <img src="image/ロゴ.png">
    </div>

    <h2>パスワードの再設定</h2>
    
    <p>ご登録のメールアドレスを入力してください。<br>パスワード再設定用のURLをお送りします。</p>

    <form action="#" method="POST">
        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required>
        </div>

        <button type="submit" class="btn-submit">再設定メールを送信する</button>
    </form>

    <a href="#" class="link-back">ログイン画面へ戻る</a>
</div>

</body>
</html>
